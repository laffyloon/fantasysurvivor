<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survivor 51 Fantasy League</title>
<meta name="description" content="Live standings, tribes and scoring for the Survivor 51 fantasy league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f6f1e4; --surface:#ffffff; --surface-2:#fbf7ec; --line:#e6dcc4;
  --ink:#2b2a26; --ink-2:#5f5b52; --ink-3:#8d877a;
  --lime:#afe313; --lime-ink:#3d5200; --orange:#ff9900; --orange-ink:#8a4b00;
  --slate:#899499; --slate-dark:#5d676c; --neg:#c0392b; --pos:#2e7d32;
  --gold:#e0a400; --silver:#9aa3a7; --bronze:#b8763a;
  --shadow:0 1px 2px rgba(60,50,20,.06),0 2px 8px rgba(60,50,20,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1a17; --surface:#25241f; --surface-2:#2c2b25; --line:#3a382f;
    --ink:#f1ede2; --ink-2:#c9c3b3; --ink-3:#978f7e;
    --lime-ink:#cdf26b; --orange-ink:#ffb84d; --slate-dark:#aab4b8; --neg:#ff7b6b; --pos:#7fd88a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Roboto,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(135deg,#2d3a0a 0%,#4a5c10 55%,#7a4a00 100%);color:#fff;padding:22px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.torch{width:38px;height:38px;flex:none}
h1{font:800 26px/1.05 "Roboto Condensed",Roboto,sans-serif;letter-spacing:.3px;margin:0;text-transform:uppercase}
.sub{opacity:.85;font-size:13px;margin-top:4px}
.pot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:flex-end}
.pot div{border-radius:10px;padding:6px 11px;font-size:12px;line-height:1.2;color:#2a2410;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pot .p-total{background:#afe313;color:#243000}
.pot .p-total{padding:8px 14px}.pot .p-total b{font-size:24px;font-weight:800}
.pot .p1{padding:7px 12px}.pot .p1 b{font-size:19px;font-weight:700}
.pot .p2{padding:6px 10px}.pot .p2 b{font-size:16px;font-weight:600}
.pot .p3{padding:5px 9px;font-size:11px}.pot .p3 b{font-size:14px;font-weight:600}
.pot .p1{background:linear-gradient(160deg,#f3d36b,#d4a017)}
.pot .p2{background:linear-gradient(160deg,#e3e8eb,#a8b2b8)}
.pot .p3{background:linear-gradient(160deg,#dca47a,#b87333)}
.pot b{display:block;font:700 17px "Roboto Condensed",Roboto,sans-serif}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:13px 6px 11px;font:700 13px "Roboto Condensed",Roboto,sans-serif;letter-spacing:.2px;text-transform:uppercase;color:var(--ink-3);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--lime)}
@media (max-width:400px){nav.tabs .wrap{padding:0 8px;justify-content:space-between}nav.tabs button{font-size:12px;padding:13px 3px 11px;letter-spacing:0}}
main{padding:16px 0 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--ink-3)}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px;outline:none}
.search:focus{border-color:var(--lime)}
/* standings */
.st-list{list-style:none;margin:0;padding:0}
.st-item{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:0 12px;padding:11px 14px 11px 20px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);background:color-mix(in srgb,var(--tc,transparent) 13%,var(--surface))}
.st-item .swatch{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--tc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.st-list .st-item:first-child .swatch{border-top-left-radius:var(--radius)}
.st-list .st-item:last-child .swatch{border-bottom-left-radius:var(--radius)}
.score small.mv{display:block;font:700 11px Roboto,sans-serif;text-align:right;margin-top:1px}
.mv.up{color:var(--pos)}.mv.down{color:var(--neg)}
.banner{margin:-18px -18px 16px;padding:18px;border-radius:var(--radius) var(--radius) 0 0;background:var(--tc);color:var(--tink);border-bottom:1px solid rgba(0,0,0,.08)}
.hero .banner .leader{color:inherit;opacity:.85}
.banner .muted{color:inherit;opacity:.8}
.banner .pill{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.12);color:#2b2a26}
.rankchart{padding:12px 8px 6px}
.rankchart svg{display:block;width:100%;height:auto;overflow:visible}
.rankchart text{font:500 10px Roboto,sans-serif;fill:var(--ink-3)}
.rankchart .lbl{font:600 10px "Roboto Condensed",Roboto,sans-serif;fill:var(--ink-2)}
.since{margin-top:8px;font-size:13px;font-weight:700;color:var(--orange-ink)}
.player.dropped .top,.player.dropped .cats{opacity:.6}
.st-item:first-child{border-top:0}
/* voted out */
.out-name{text-decoration:line-through;text-decoration-color:rgba(215,38,30,.85);text-decoration-thickness:1px}
.player.out .avatar{filter:grayscale(1);opacity:.45}
.player.out .who b,.player.out .who span,.player.out .pts,.player.out .cats .cat{opacity:.55}
.player.out .who b{opacity:.7}
.pill.snuffed{background:#2b2622;border-color:#2b2622;color:#ffb07a}
@media (prefers-color-scheme: dark){.pill.snuffed{background:#45291f;border-color:#6b3a28}}
.ctable tr.out td{color:var(--ink-3)}
.ctable tr.out td b{color:var(--ink-3)}
.who span.left{display:inline;color:var(--neg);font-weight:600}
.st-item:hover{filter:brightness(.97)}
.rank{width:40px;flex:none;text-align:center;font:800 16px "Roboto Condensed",Roboto,sans-serif;color:var(--ink-2)}
.rank small{display:block;font:500 10px Roboto,sans-serif;color:var(--ink-3);letter-spacing:.4px}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:800 15px "Roboto Condensed",Roboto,sans-serif}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.who{min-width:0;flex:1}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font:800 22px "Roboto Condensed",Roboto,sans-serif;min-width:44px;text-align:right}
.chev{color:var(--ink-3);flex:none}
/* tribe */
.pickbox{padding:14px;margin-bottom:14px;border:2px solid var(--lime)}
.pickbox label{display:block;font:800 18px "Roboto Condensed",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.4px}
.pickbox p{margin:2px 0 10px;color:var(--ink-3);font-size:13px}
.pickbox select{width:100%;padding:13px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:16px;font-weight:500}
.findmine{display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;text-align:left;background:var(--lime);color:#243000;border:0;border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.findmine span{font:800 18px "Roboto Condensed",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.4px}
.findmine small{grid-column:1;font-size:13px;opacity:.85}
.findmine b{grid-row:1/3;grid-column:2;font-size:30px;line-height:1}
.hero{padding:18px}
.hero .tname{font:800 24px/1.1 "Roboto Condensed",Roboto,sans-serif}
.hero .leader{color:var(--ink-2);margin-top:2px}
.big{font:800 46px/1 "Roboto Condensed",Roboto,sans-serif}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.tiny{font-size:10px;padding:1px 6px;vertical-align:1px}
.pill.lime{background:var(--lime);border-color:var(--lime);color:#243000}
.pill.orange{background:#fff1db;border-color:#ffd9a0;color:#8a4b00}
@media (prefers-color-scheme: dark){.pill.orange{background:#3d2a0d;border-color:#6b4a16;color:#ffb84d}}
.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.breakdown div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.breakdown b{display:block;font:800 20px "Roboto Condensed",Roboto,sans-serif}
.breakdown span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
h2{font:800 15px "Roboto Condensed",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);margin:22px 2px 8px}
.players{list-style:none;margin:0;padding:0}
.player{padding:12px 14px;border-top:1px solid var(--line)}
.player:first-child{border-top:0}
.player .top{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 14px "Roboto Condensed",Roboto,sans-serif;color:#fff;background:var(--slate)}

.player .pts{font:800 20px "Roboto Condensed",Roboto,sans-serif;text-align:right}
.player .pts small{display:block;font:500 11px Roboto,sans-serif;color:var(--ink-3)}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.cat{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.cat.neg{color:var(--neg)}
.cat b{font-weight:700;color:var(--pos)}.cat.neg b{color:var(--neg)}.cat small{font-size:10px;color:var(--ink-3)}
.star{color:var(--orange);font-size:14px}
/* bars */
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:14px 14px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--lime);min-height:2px}
.bar i.neg{background:var(--neg);border-radius:0 0 5px 5px}
.bar i.post{background:var(--orange)}
.bar em{font-style:normal;font:700 12px "Roboto Condensed",Roboto,sans-serif;margin-bottom:3px;color:var(--ink-2)}
.barlabels{display:flex;gap:6px;padding:6px 14px 12px;border-top:1px solid var(--line);margin-top:0}
.barlabels span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);padding:0 14px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* castaways */
.ctable{width:100%;border-collapse:collapse}
.ctable th{font:700 11px Roboto,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.ctable th.num,.ctable td.num{text-align:right}
.ctable td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.ctable tr.main{cursor:pointer}
.ctable tr.main:hover td{background:var(--surface-2)}
.ctable tr.detail td{background:var(--surface-2);border-top:0;padding-top:0}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;margin-top:8px}
.eps div{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 0;font-size:12px}
.eps div small{display:block;color:var(--ink-3);font-size:10px}
.pos{color:var(--pos)}.negv{color:var(--neg)}
/* tribes holding a castaway (Castaways tab detail) */
.holders{list-style:none;margin:6px 0 4px;padding:0;display:grid;grid-template-columns:1fr;gap:4px}
@media (min-width:640px){.holders{grid-template-columns:1fr 1fr}}
.holders li{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
.holders li:hover{border-color:var(--ink-3)}
.holders i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.holders b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.holders span{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
/* episodes */
.epchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.epchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:700 13px "Roboto Condensed",Roboto,sans-serif;cursor:pointer;white-space:nowrap}
.epchips button[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#243000}
.ev{padding:12px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .head{display:flex;gap:10px;align-items:baseline}
.ev .note{font-weight:400;font-size:12px;color:var(--ink-3);white-space:nowrap}
.ev .val{font:800 15px "Roboto Condensed",Roboto,sans-serif;min-width:34px}
.names{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.names span{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.state{padding:40px 16px;text-align:center;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.stats{grid-template-columns:1fr 1fr}.stat.wide{grid-column:1/-1}}
.stat{padding:12px 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.pair{grid-column:1/-1}}
.pair .stat h3{font-size:13px}
.pair .stat p{min-height:2.6em}
.stat h3{margin:0;font:800 14px "Roboto Condensed",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.stat p{margin:2px 0 0;font-size:12px}
.stat ul{list-style:none;margin:8px 0 0;padding:0}
.stat li{display:grid;grid-template-columns:1fr auto;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.stat li:first-child{border-top:0}
.stat li span{grid-column:1;font-size:12px;color:var(--ink-3)}
.stat li em{grid-row:1/3;grid-column:2;font:800 20px "Roboto Condensed",Roboto,sans-serif;font-style:normal}
.h2sub{font:600 12px Roboto,sans-serif;letter-spacing:.3px;color:var(--ink-3);margin-left:6px;text-transform:none}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:640px){.pillars{grid-template-columns:repeat(4,1fr)}}
.pillar{padding:10px 12px 10px;border-top:4px solid var(--pc);min-width:0}
.pillar h3{margin:0;font:800 12px "Roboto Condensed",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
.pillar p{margin:6px 0 0;font-size:12px}
.rk-lead{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:8px;margin-top:6px}
.rk-lead b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-lead > span{grid-column:1;font-size:12px;color:var(--ink-3)}
.rk-lead b.tie2,.rk-lead b.tie4{white-space:normal;line-height:1.3;overflow:visible;text-overflow:clip}
.rk-lead b.tie2{font-size:14px}
.rk-lead b.tie4{font-size:13px}
.rk-lead b span{white-space:nowrap}
.rk-lead .sep{font-style:normal;color:var(--ink-3);font-weight:400;margin:0 1px}
.rk-lead b.out-name,.rk-lead b span.out-name{color:var(--ink-3)}
.rk-lead em{grid-row:1/3;grid-column:2;font:800 22px "Roboto Condensed",Roboto,sans-serif;font-style:normal}
.rk-rest{list-style:none;margin:8px 0 0;padding:6px 0 0;border-top:1px solid var(--line);display:grid;gap:3px}
.rk-rest li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px;align-items:baseline;font-size:12px;color:var(--ink-3)}
.rk-rest i{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
.rk-rest span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-rest em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.rk-more{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:8px;padding:6px 0 0;border:0;border-top:1px dashed var(--line);background:none;font:700 12px Roboto,sans-serif;color:var(--ink-2);cursor:pointer}
.rk-more:hover{color:var(--ink)}
.rk-more:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:4px}
/* an opened card takes the full width so the whole list stays readable on a phone */
.pillars{align-items:start}
.pillars .pillar.open,.stats .stat.open{grid-column:1/-1}
.open .rk-rest{display:block;columns:2;column-gap:20px}
.open .rk-rest li{break-inside:avoid;margin-bottom:3px}
/* inside .stat cards the older ".stat li" grid would win; reset it for the ranked lists */
.stat .rk-rest li{grid-template-columns:16px minmax(0,1fr) auto;padding:0;border-top:0}
.stat .rk-rest li span{grid-column:auto;font-size:12px;color:var(--ink-3)}
.stat .rk-rest li em{grid-row:auto;grid-column:auto;font:700 12px Roboto,sans-serif;font-variant-numeric:tabular-nums}
.stat li em small{font:500 11px Roboto,sans-serif;color:var(--ink-3);margin-left:1px}
@media (min-width:640px){.pair.half{grid-column:auto}}
.stat .catlead li{grid-template-columns:1fr auto;gap:0 10px}
.stat .catlead li span{font-size:13px;color:var(--ink-2)}
.stat .catlead li b{grid-column:1;font-size:13px}
.stat .catlead li em{font-size:16px;color:var(--ink-3)}
.foot{font-size:12px;color:var(--ink-3);text-align:center;margin-top:28px}
.foot button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink-2);margin-left:6px}
/* old players: out rows go compact, dropped rows stay faded */
.card:has(> .players){overflow:hidden}
.player.out{padding:8px 14px;background:var(--surface-2)}
.player.out .avatar{width:28px;height:28px;font-size:11px}
.player.out .pts{font-size:16px}
.who span.outtag{color:var(--ink-2);font-weight:500}
.ctable tr.divider td{background:var(--surface-2);font:700 11px Roboto,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3);padding:8px 12px}
/* category race */
.race{list-style:none;margin:0;padding:2px 0}
.race-row{display:grid;grid-template-columns:minmax(70px,104px) 1fr 46px;align-items:center;gap:4px 10px;padding:7px 14px;border-top:1px solid var(--line);cursor:pointer}
.race-row:first-child{border-top:0}
.race-row:hover{background:var(--surface-2)}
.race-row .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-row.out .nm{color:var(--ink-3)}
.race-bar{display:flex;gap:2px;height:16px}
.race-bar i{flex:1;min-width:0;border-radius:3px;background:var(--line)}
.race-row.out .race-bar i.on{opacity:.45}
.race-n{font:800 18px/1 "Roboto Condensed",Roboto,sans-serif;text-align:right}
.race-n small{font:500 11px Roboto,sans-serif;color:var(--ink-3)}
.race-detail{grid-column:1/-1;padding:6px 0 4px}
.race-detail .cats{margin-top:4px}
.race-detail h4{margin:8px 0 0;font:700 11px Roboto,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.cat.missing{opacity:.6;border-style:dashed}
.race-lead{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--orange-ink);margin-top:-2px}
/* standings roster line (folded in from the old All Tribes tab) */
.st-roster{flex-basis:100%;display:flex;flex-wrap:wrap;gap:2px 12px;padding:5px 26px 0 52px;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.rp{white-space:nowrap}
.rp b{font:700 12px "Roboto Condensed",Roboto,sans-serif;color:var(--ink-3)}
.rp.out{color:var(--ink-3)}
.rp.out span{text-decoration:line-through;text-decoration-color:rgba(215,38,30,.85)}
.rp.out b{opacity:.7}
.st-item{--tn:var(--tn-l)}

<body>

<script>
/* ============ CONFIG: the published master sheet ============ */
const PUB = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqBPKyWh1EMRMfb-zVIaZuVErk-BmHfEBw-odyJJ_0HdnbFkQZORSWEOAWPFJu5hu_XuagnOfNeK_X/pub";
const TABS = { standings: 0, log: 1, tribes: 2, castaways: 3 };   // sheet gids
/* ============================================================ */

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[$,]/g,"")); return isNaN(n) ? 0 : n; };
const signed = n => (n > 0 ? "+" : "") + n;

function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
async function getTab(gid){
  const url = `${PUB}?gid=${gid}&single=true&output=csv&t=${Date.now()}`;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000);
  try{
    const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.text();
  } finally { clearTimeout(timer); }
}
const col = (header, name) => header.findIndex(h => h.trim().toUpperCase() === name.toUpperCase());
const colStarts = (header, name) => header.findIndex(h => h.trim().toUpperCase().startsWith(name.toUpperCase()));

let D = null;
let view = "standings";

function model(st, lg, tb, cp){
  // settings live in the Standings tab, columns K:L
  const settings = {};
  st.forEach(r => { if (r[10]) settings[r[10].trim()] = (r[11] ?? "").trim(); });
  const merge = num(settings["First post-merge episode (DO NOT EDIT)"]) || 99;

  // castaways (top table on Castaway Points)
  const ch = cp[0];
  const epCols = [];
  for (let e = 2; e <= 13; e++){ const i = col(ch, String(e)); if (i >= 0) epCols.push([e, i]); }
  const cI = {
    name: col(ch,"CASTAWAY"), season: col(ch,"SEASON"), cats: col(ch,"CATS HIT"), made: colStarts(ch,"MADE MERGE"),
    pre: col(ch,"PRE-MERGE PTS"), post: col(ch,"POST-MERGE PTS"), bonus: col(ch,"BONUS PTS"),
    full: col(ch,"FULL NAME"), catlist: col(ch,"CATEGORIES"), gt: col(ch,"GAME TRIBE"), gc: col(ch,"GAME TRIBE COLOR")
  };
  const castaways = [];
  for (let i = 1; i < cp.length; i++){
    const r = cp[i]; if (!r[cI.name] || !r[cI.name].trim()) break;
    castaways.push({
      name: r[cI.name].trim(), full: r[cI.full] || "",
      gtribe: cI.gt >= 0 ? (r[cI.gt] || "").trim() : "",
      gcolor: cI.gc >= 0 && /^#?[0-9a-f]{6}$/i.test((r[cI.gc] || "").trim()) ? "#" + r[cI.gc].trim().replace("#","") : "", season: num(r[cI.season]), catsHit: num(r[cI.cats]),
      made: String(r[cI.made]).toUpperCase() === "TRUE", pre: num(r[cI.pre]), post: num(r[cI.post]), bonus: num(r[cI.bonus]),
      eps: Object.fromEntries(epCols.map(([e, j]) => [e, num(r[j])])),
      categories: (r[cI.catlist] || "").split(";").map(s => s.trim()).filter(Boolean)
    });
  }
  const byName = Object.fromEntries(castaways.map(c => [c.name.toLowerCase(), c]));
  // category hits block: CASTAWAY header followed by category names
  const hIdx = cp.findIndex((r, i) => i > 0 && (r[0] || "").trim().toUpperCase() === "CASTAWAY" && r[1] && isNaN(parseFloat(r[1])));
  let catHits = [];
  if (hIdx > 0){
    const hh = cp[hIdx];
    catHits = hh.slice(1).map(x => (x || "").trim()).filter(Boolean);
    for (let i = hIdx + 1; i < cp.length; i++){
      const r = cp[i]; const n = (r[0] || "").trim().toLowerCase(); if (!n || !byName[n]) break;
      byName[n].hits = {}; catHits.forEach((cat, k) => { byName[n].hits[cat] = num(r[k + 1]); });
    }
  }
  // signed events block (second CASTAWAY header on Castaway Points): +1/-1 per event, feeds Sole Survivor +1 by episode
  const sIdx = cp.findIndex((r, i) => i > 0 && (r[0] || "").trim().toUpperCase() === "CASTAWAY");
  if (sIdx > 0){
    const sh = cp[sIdx];
    for (let i = sIdx + 1; i < cp.length; i++){
      const r = cp[i]; const n = (r[0] || "").trim().toLowerCase(); if (!n || !byName[n]) break;
      byName[n].sig = {};
      for (let e = 2; e <= 13; e++){ const j = col(sh, String(e)); if (j >= 0) byName[n].sig[e] = num(r[j]); }
    }
  }

  // episode log
  const lh = lg[0];
  const logEps = [];
  for (let e = 2; e <= 13; e++){ const i = col(lh, "Ep " + e); if (i >= 0) logEps.push([e, i]); }
  // draft mode: the "LIVE ON SITE?" row holds a checkbox per episode. Unticked episodes are drafts and stay
  // off the site (the sheet already leaves them out of every total). No row at all = every episode is live.
  const liveRow = lg.find(r => /^live on site/i.test((r[0] || "").trim()));
  const isLive = j => !liveRow || String(liveRow[j] || "").trim().toUpperCase() === "TRUE";
  const liveEps = logEps.filter(([e, j]) => isLive(j));
  const events = [];
  const pointsFor = {};
  const sectionOf = {};   // category -> the section header above it (Outwit, Outplay, ...)
  let section = "";
  for (let i = 1; i < lg.length; i++){
    const r = lg[i]; const label = (r[0] || "").trim();
    if (!label || /^(spell check|live on site)/i.test(label)) continue;
    const pts = r[1];
    if (pts === undefined || pts === ""){ section = label; continue; } // section header
    pointsFor[label] = num(pts);
    sectionOf[label] = section;
    liveEps.forEach(([e, j]) => {
      const names = (r[j] || "").split(",").map(s => s.trim()).filter(Boolean);
      if (names.length) events.push({ ep: e, label, pts: num(pts), names });
    });
  }
  const latest = events.reduce((m, ev) => Math.max(m, ev.ep), 0);

  // eliminations: the torch-lit row lists everyone still in the game. Anyone missing from a filled-in
  // torch cell is out as of that episode, and stays out.
  const nameKey = n => n.toLowerCase().replace(/[^a-z]/g, "");   // same idea as the sheet's match name: ignore case and spaces
  const torch = events.filter(ev => /torch lit/i.test(ev.label)).sort((a,b) => a.ep - b.ep);
  castaways.forEach(c => {
    const key = nameKey(c.name);
    const hit = torch.find(ev => !ev.names.some(n => nameKey(n) === key));
    c.out = hit ? hit.ep : 0;
    // quitters get their own label: out in the same episode they're listed under "Voluntarily quits the game"
    c.quit = !!hit && events.some(ev => ev.ep === hit.ep && /quits the game/i.test(ev.label) && ev.names.some(n => nameKey(n) === key));
  });

  // tribes
  const th = tb[0];
  const tI = n => col(th, n);
  const tribes = [];
  for (let i = 1; i < tb.length; i++){
    const r = tb[i]; const leader = (r[tI("LEADER")] || "").trim(); if (!leader) continue;
    const draft = [1,2,3,4,5].map(k => (r[tI("DRAFT " + k)] || "").trim()).filter(Boolean);
    const after = [1,2,3,4,5].map(k => (r[tI("AFTER MERGE " + k)] || "").trim()).filter(Boolean);
    tribes.push({
      leader, tribe: (r[tI("TRIBE")] || "").trim(), draft, after, ss: (r[tI("SOLE SURVIVOR")] || "").trim(),
      pre: num(r[tI("PRE-MERGE")]), post: num(r[tI("POST-MERGE")]), ssPts: num(r[tI("SS +1")]),
      bonus: num(r[tI("BONUSES")]), total: num(r[tI("TOTAL")]),
      color: /^#?[0-9a-f]{6}$/i.test((r[tI("COLOR")] || "").trim()) ? "#" + r[tI("COLOR")].trim().replace("#","") : "#899499"
    });
  }
  const isOut = n => (byName[n.toLowerCase()]?.out || 0) > 0;
  tribes.forEach(t => { const r = rosterAt(t, 99, merge); t.left = r.filter(n => !isOut(n)).length; t.size = r.length; });
  // rank from totals (ties share a rank)
  tribes.forEach(t => { t.rank = 1 + tribes.filter(o => o.total > t.total).length; t.tied = tribes.filter(o => o.total === t.total).length > 1; });

  // week-by-week totals and ranks, rebuilt from each episode's scores
  const ssVal = num(settings["Sole Survivor +1 value"]) || 1;
  const eps = []; for (let e = 2; e <= Math.max(latest, 2); e++) eps.push(e);
  tribes.forEach(t => {
    let cum = 0; t.hist = [];
    eps.forEach(e => {
      const r = rosterAt(t, e, merge);
      cum += r.reduce((s, n) => s + (byName[n.toLowerCase()]?.eps[e] || 0), 0);
      if (e >= merge && t.ss && r.includes(t.ss)) cum += ssVal * (byName[t.ss.toLowerCase()]?.sig?.[e] || 0);
      t.hist.push({ ep: e, total: cum });
    });
    // one-time bonuses (made merge, FTC, winner, most categories) land on the latest episode, so the last point always matches the sheet
    if (t.hist.length) t.hist[t.hist.length - 1].total = t.total;
  });
  eps.forEach((e, k) => tribes.forEach(t => { t.hist[k].rank = 1 + tribes.filter(o => o.hist[k].total > t.hist[k].total).length; }));
  tribes.forEach(t => { const h = t.hist; t.move = latest > 2 && h.length > 1 ? h[h.length - 2].rank - h[h.length - 1].rank : 0; });

  return { settings, merge, castaways, byName, events, latest, tribes, pointsFor, catHits, sectionOf,
    pot: { total: settings["Total collected"],
      p1: settings["Announced: 1st"] || settings["First place (70%, calculated)"] || settings["First place (70%)"],
      p2: settings["Announced: 2nd"] || settings["Second place (20%, calculated)"] || settings["Second place (20%)"],
      p3: settings["Announced: 3rd"] || settings["Third place (10%, calculated)"] || settings["Third place (10%)"] },
    winner: settings["Winner"] || "" };
}

// which five count for an episode: after-merge roster (if filled in) from the first post-merge episode on
function rosterAt(t, ep, merge = D.merge){ return (ep >= merge && t.after.length) ? t.after : t.draft; }
function tribeEpisodePoints(t){
  const out = [];
  for (let e = 2; e <= Math.max(D.latest, 2); e++){
    const roster = rosterAt(t, e);
    out.push({ ep: e, pts: roster.reduce((s, n) => s + (D.byName[n.toLowerCase()]?.eps[e] || 0), 0), post: e >= D.merge });
  }
  return out;
}
// "Frankie Carrera" -> "Frankie"; keeps "Preston & Carly" whole; two Jordans become "Jordan K." / "Jordan S."
function firstName(full){
  if (full.includes("&")) return full;
  const parts = full.trim().split(/\s+/), first = parts[0];
  const clash = D.tribes.filter(t => t.leader.trim().split(/\s+/)[0].toLowerCase() === first.toLowerCase()).length > 1;
  return clash && parts[1] ? `${first} ${parts[1][0]}.` : first;
}
const inkOn = hex => { const h = hex.replace("#",""); const [r,g,b] = [0,2,4].map(i => parseInt(h.substr(i,2),16)/255).map(v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4)); return (0.2126*r + 0.7152*g + 0.0722*b) > 0.32 ? "#1d1d1b" : "#ffffff"; };
// tribe color nudged darker (light mode) or lighter (dark mode) until it reads clearly on its own row tint
const _rgb = hex => [0,2,4].map(i => parseInt(hex.replace("#","").substr(i,2),16));
const _lum = ([r,g,b]) => { const f = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }; return .2126*f(r) + .7152*f(g) + .0722*f(b); };
const _cr = (a, b) => { const [x, y] = [_lum(a), _lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
function nameInk(hex, dark){
  const tc = _rgb(hex), surf = dark ? [37,36,31] : [255,255,255];
  const bg = surf.map((v, i) => Math.round(v * .87 + tc[i] * .13));   // matches the row's 13% tint
  let [r, g, b] = tc.map(v => v / 255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn){ const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  s = Math.min(s, .72);   // keep it easy on the eye
  const rgbOf = L => { if (!s) return [L,L,L].map(v => Math.round(v*255)); const q = L < .5 ? L*(1+s) : L+s-L*s, p = 2*L-q;
    const k = t => { t = (t+1) % 1; return t < 1/6 ? p+(q-p)*6*t : t < .5 ? q : t < 2/3 ? p+(q-p)*(2/3-t)*6 : p; };
    return [k(h+1/3), k(h), k(h-1/3)].map(v => Math.round(v*255)); };
  let c = rgbOf(l);
  for (let i = 0; i < 60 && _cr(c, bg) < 4.6; i++){ l = dark ? Math.min(1, l + .015) : Math.max(0, l - .015); c = rgbOf(l); }
  return "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");
}
const lineColor = hex => inkOn(hex) === "#ffffff" ? hex : "var(--slate-dark)";
const moveTag = t => t.move > 0 ? `<small class="mv up" title="Up ${t.move} since last episode">▲${t.move}</small>` : t.move < 0 ? `<small class="mv down" title="Down ${-t.move} since last episode">▼${-t.move}</small>` : "";
function rankChart(t){
  const h = t.hist, N = D.tribes.length;
  if (h.length < 2) return `<div class="state" style="padding:22px 16px">Currently #${t.rank} of ${N}. The line starts once Episode 3 is scored.</div>`;
  const W = Math.max(260, Math.min(window.innerWidth, 860) - 48), H = 150, L = 28, Rp = 24, T = 20, B = 22, P = 14;
  const x = i => L + P + (h.length === 1 ? 0 : i * (W - L - P - Rp) / (h.length - 1));
  const y = r => T + (r - 1) * (H - T - B) / Math.max(N - 1, 1);
  const c = lineColor(t.color);
  const grid = [1, Math.round(N/2), N].map(r => `<line x1="${L}" x2="${W-Rp}" y1="${y(r)}" y2="${y(r)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${r===1?"":"2 4"}"/><text x="${L-6}" y="${y(r)+3}" text-anchor="end">${r}</text>`).join("");
  const path = h.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.rank).toFixed(1)}`).join(" ");
  const dots = h.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.rank)}" r="2.5" fill="${c}" stroke="var(--surface)" stroke-width="1.5"/><text class="lbl" x="${x(i)}" y="${y(p.rank) - 8}" text-anchor="middle">${p.rank}</text><text x="${x(i)}" y="${H - 6}" text-anchor="middle">Ep ${p.ep}</text>`).join("");
  return `<div class="rankchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Place by episode">${grid}<path d="${path}" fill="none" stroke="${c}" stroke-width="1.5" stroke-opacity=".85" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>`;
}
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0,2).toUpperCase();
const hue = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const avatar = n => {
  const c = D && D.byName[n.toLowerCase()];
  if (c && c.gcolor) return `<div class="avatar" style="background:${c.gcolor};color:${inkOn(c.gcolor)}" title="${esc(c.gtribe || "")}">${esc(initials(n))}</div>`;
  return `<div class="avatar" style="background:hsl(${hue(n)} 32% 46%)">${esc(initials(n))}</div>`;
};
// short rule reminders shown under category names on the Episodes tab
const NOTES = [
  [/hard fall/i, "(to the ego counts)"],
  [/successful play of idol/i, "(must change vote)"],
  [/wins individual/i, "(incl. fire making)"],
  [/first out of challenge/i, "(4+ competitors only)"],
  [/throws or quits a challenge/i, "(quitting for food counts)"]
];
const noteFor = label => (NOTES.find(([re]) => re.test(label)) || [])[1] || "";
const isNeg = label => (D.pointsFor[label] ?? 0) < 0;
const cOf = n => D.byName[n.toLowerCase()] || { name: n, full:"", eps:{}, pre:0, post:0, bonus:0, season:0, categories:[], out:0 };
// what a castaway has scored for one tribe (dropped players only count up to the merge, added ones only after).
// Bonuses are included so a tribe's players add up to its total: the made-merge bonus stays with the tribe that
// had the player through the merge episode (the draft five); later bonuses (FTC, winner, most categories) go to
// whoever holds the player after the merge.
const mergeBonus = c => c.made ? (num(D.settings["Bonus: makes merge"]) || 5) : 0;
const lateBonus = c => c.bonus - mergeBonus(c);
function ptsFor(t, n){
  const c = cOf(n), merged = D.merge < 99, swapped = merged && t.after.length;
  if (!merged) return { pts: c.pre + c.bonus, note: "this season" };
  if (swapped && !t.draft.includes(n)) return { pts: c.post + lateBonus(c), note: `from Ep ${D.merge}` };
  if (swapped && !t.after.includes(n)) return { pts: c.pre + mergeBonus(c), note: `through Ep ${D.merge - 1}` };
  return { pts: c.pre + c.post + c.bonus, note: "for this tribe" };
}
// category race: one segment per point-scoring category, colored by its section on the Episode Log
const PILLARS = [[/outwit/i, "Outwit", "#3d8fd1"], [/outplay/i, "Outplay", "#ff9900"], [/outlast/i, "Outlast", "#86b800"], [/trick/i, "Bag of Tricks", "#a46fd6"]];
const pillarOf = label => { const k = PILLARS.findIndex(([re]) => re.test(D.sectionOf[label] || "")); return k < 0 ? PILLARS.length : k; };
const pillarColor = label => (PILLARS[pillarOf(label)] || [0, 0, "var(--slate)"])[2];
function raceCats(){
  // rules: "earns points from the most distinct point categories". Penalties don't earn points; one-time bonuses aren't categories.
  // Torch lit does earn points, so it counts (matches the sheet's CATS HIT).
  return Object.keys(D.pointsFor)
    .filter(l => D.pointsFor[l] > 0 && !/one.?time|bonus/i.test(D.sectionOf[l] || ""))
    .map((l, i) => [l, i]).sort((a, b) => pillarOf(a[0]) - pillarOf(b[0]) || a[1] - b[1]).map(x => x[0]);
}
// match category names loosely (case, spaces, punctuation) so a small label difference between sheet blocks can't zero a bar
const catKey = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const hitsOf = (c, label) => {
  const key = catKey(label);
  if (c.hits){ for (const h in c.hits) if (catKey(h) === key && c.hits[h]) return c.hits[h]; }
  return c.categories.some(x => catKey(x) === key) ? 1 : 0;
};

/* ---------------- views ---------------- */
// standings: one row per tribe with its current players and their points on a quiet second line
function vStandings(){
  const raw = (store.get("s51.q") || ""), q = raw.trim().toLowerCase();
  const merged = D.merge < 99;
  const sorted = [...D.tribes].sort((a,b) => b.total - a.total || a.leader.localeCompare(b.leader));
  // legend items only appear once there's something on screen for them to explain
  const hasSS = D.tribes.some(t => t.ss && rosterAt(t, 99).includes(t.ss));
  const hasAdded = merged && D.tribes.some(t => t.after.length && t.after.some(n => !t.draft.includes(n)));
  const match = t => !q || (t.leader + " " + t.tribe).toLowerCase().includes(q) || [...t.draft, ...t.after].some(n => n.toLowerCase().includes(q));
  const items = sorted.filter(match).map(t => {
    const r = t.rank <= 3 ? `<span class="medal m${t.rank}">${t.rank}</span>` : `${t.rank}`;
    const roster = rosterAt(t, 99);
    const order = [...roster.filter(n => !cOf(n).out), ...roster.filter(n => cOf(n).out)];
    const players = order.map(n => {
      const c = cOf(n), isAdded = merged && t.after.length && !t.draft.includes(n), hit = q && n.toLowerCase().includes(q);
      return `<span class="rp ${c.out ? "out" : ""} ${isAdded ? "added" : ""} ${hit ? "hit" : ""}" title="${esc(c.full || n)}${c.out ? ` · ${c.quit ? "quit" : "out"} Ep ${c.out}` : ""}${isAdded ? " · added at merge" : ""}${t.ss === n ? " · Sole Survivor pick" : ""}">${t.ss === n ? '<i class="ss" aria-label="Sole Survivor pick">★</i>' : ""}<span>${esc(n)}</span> <b>${ptsFor(t, n).pts}</b></span>`;
    }).join("");
    return `<li class="st-item" data-leader="${esc(t.leader)}" style="--tc:${t.color};--tn-l:${nameInk(t.color, false)};--tn-d:${nameInk(t.color, true)}">
      <span class="swatch"></span>
      <div class="rank">${r}${t.tied ? "<small>TIED</small>" : ""}</div>
      <div class="who"><b>${esc(t.tribe)}</b><span>${esc(firstName(t.leader))}${t.left < t.size ? ` · <span class="left">${t.left} of ${t.size} left</span>` : ""}</span></div>
      <div class="score">${t.total}${moveTag(t)}</div>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div class="st-roster">${players}</div>
    </li>`;
  }).join("");
  return `<button class="findmine" data-go="tribe"><span>See your tribe</span><small>Your players, points and history</small><b>›</b></button>
    <input class="search" id="q" placeholder="Find a tribe, leader or castaway" value="${esc(raw)}" aria-label="Search tribes and castaways">
    ${hasSS || hasAdded ? `<div class="keyline">${hasSS ? '<span><i class="ss">★</i> Sole Survivor pick</span>' : ""}${hasAdded ? '<span class="rp added"><span>Added at merge</span></span>' : ""}</div>` : ""}
    <div class="card"><ul class="st-list">${items || '<li class="state">No matches</li>'}</ul></div>`;
}

function vTribe(){
  const sel = store.get("s51.tribe");
  const tribes = [...D.tribes].sort((a,b) => a.leader.localeCompare(b.leader));
  const t = tribes.find(x => x.leader === sel) || tribes[0];
  const opts = tribes.map(x => `<option value="${esc(x.leader)}" ${x === t ? "selected" : ""}>${esc(firstName(x.leader))} - ${esc(x.tribe)}</option>`).join("");
  const merged = D.merge < 99;
  const swapped = merged && t.after.length;
  const current = swapped ? t.after : t.draft;
  const dropped = swapped ? t.draft.filter(n => !t.after.includes(n)) : [];
  const added = swapped ? t.after.filter(n => !t.draft.includes(n)) : [];

  // category breakdowns moved to the Castaways tab (category race); rows here just show who, status and points
  const outText = c => c.out ? (c.quit ? `🤡 Quit · Ep ${c.out}` : `🔥 Out · Ep ${c.out}`) : "";
  const playerRow = (n, kind) => {
    const c = cOf(n);
    const { pts, note } = kind === "dropped" ? { pts: ptsFor(t, n).pts, note: "for you" } : ptsFor(t, n);
    const ss = t.ss && t.ss === n;
    const tags = [
      ss ? `<span class="pill orange">★ Sole Survivor${c.out && kind !== "dropped" ? " · no more +1s" : ""}</span>` : "",
      kind === "added" ? '<span class="pill lime">Added at merge</span>' : "",
      c.made && c.out ? '<span class="pill">Made merge</span>' : "",
      D.winner && D.winner === n ? '<span class="pill orange">Sole Survivor winner</span>' : ""
    ].filter(Boolean).join(" ");
    const sub = kind === "dropped"
      ? `<span class="outtag">Dropped at merge${c.out ? ` · ${c.quit ? "quit" : "out"} Ep ${c.out}` : ""}</span>`
      : c.out ? `<span class="outtag">${outText(c)}${c.full ? ` · ${esc(c.full)}` : ""}</span>` : `<span>${esc(c.full)}</span>`;
    return `<li class="player ${kind === "dropped" ? "dropped" : ""} ${c.out && kind !== "dropped" ? "out" : ""}">
      <div class="top">${avatar(n)}
        <div class="who"><b class="${c.out ? "out-name" : ""}">${esc(n)}</b>${sub}</div>
        <div class="pts">${pts}<small>${note}</small></div>
      </div>
      ${tags ? `<div class="cats" style="margin-top:8px">${tags}</div>` : ""}
      ${kind === "dropped" ? (c.out && c.out < D.merge
        ? `<div class="since" style="color:var(--ink-3)">Already gone before the merge. Good call.</div>`
        : `<div class="since">Scored ${signed(c.post + lateBonus(c))} pts for other tribes since you dropped them</div>`) : ""}
    </li>`;
  };
  const live = current.filter(n => !cOf(n).out);
  const gone = current.filter(n => cOf(n).out).sort((a, b) => cOf(b).out - cOf(a).out);
  const kindOf = n => added.includes(n) ? "added" : "";

  const epPts = tribeEpisodePoints(t);
  const maxAbs = Math.max(1, ...epPts.map(e => Math.abs(e.pts)));
  const bars = epPts.map(e => {
    const h = Math.round(Math.abs(e.pts) / maxAbs * 100);
    return `<div class="bar"><em>${e.pts ? e.pts : ""}</em><i class="${e.pts < 0 ? "neg" : ""} ${e.post ? "post" : ""}" style="height:${Math.max(h, 2)}%"></i></div>`;
  }).join("");
  const labels = epPts.map(e => `<span>${e.ep}</span>`).join("");

  return `<div class="pickbox card"><label for="tribeSel">Pick your tribe</label><p>Tap the box below and choose your name.</p><select id="tribeSel">${opts}</select></div>
  <div class="card hero">
    <div class="banner row" style="--tc:${t.color};--tink:${inkOn(t.color)}">
      <div style="min-width:0;flex:1">
        <div class="tname">${esc(t.tribe)}</div>
        <div class="leader">${esc(t.leader)}</div>
        <div style="margin-top:8px"><span class="pill">${t.tied ? "Tied " : ""}#${t.rank} of ${D.tribes.length}</span> ${t.left < t.size ? `<span class="pill">${t.left} of ${t.size} players left</span>` : ""} ${t.move ? `<span class="pill">${t.move > 0 ? "▲ Up " + t.move : "▼ Down " + (-t.move)} since last episode</span>` : ""}</div>
      </div>
      <div style="text-align:right"><div class="big">${t.total}</div><div class="muted" style="font-size:12px">POINTS</div></div>
    </div>
    <div class="breakdown">
      <div><b>${t.pre}</b><span>Pre-merge pts</span></div>
      <div><b>${t.post}</b><span>Post-merge pts</span></div>
      <div><b>${t.ssPts}</b><span>Sole Survivor +1 pts</span></div>
      <div><b>${t.bonus}</b><span>Bonus pts</span></div>
    </div>
  </div>
  <h2>${swapped ? "Tribe after the merge" : "Tribe"}</h2>
  <div class="card"><ul class="players">${[...live, ...gone].map(n => playerRow(n, kindOf(n))).join("")}</ul></div>
  ${dropped.length ? `<h2>Dropped at the merge</h2><p class="muted" style="font-size:13px;margin:-2px 2px 8px">No regrets? Here\u2019s what they\u2019ve done since.</p><div class="card"><ul class="players">${dropped.map(n => playerRow(n, "dropped")).join("")}</ul></div>` : ""}
  <h2>Place by episode</h2>
  <div class="card">${rankChart(t)}</div>
  <h2>Points by episode</h2>
  <div class="card">
    <div class="bars">${bars}</div>
    <div class="barlabels">${labels}</div>
    ${merged ? `<div class="legend"><span><i style="background:var(--lime)"></i>Pre-merge</span><span><i style="background:var(--orange)"></i>Post-merge</span></div>` : ""}
  </div>
  <p class="muted" style="font-size:12px;margin-top:10px">Sole Survivor +1 and one-time bonuses (made merge, final tribal, winner, most categories) are included in the totals above.</p>`;
}

// Castaways stats: "Right now" moves week to week (last 3 scored episodes), "Season" is the long view
function statsBlock(){
  const cs = D.castaways;
  const N = D.tribes.length;
  const picks = n => D.tribes.filter(t => t.draft.includes(n)).length;
  const held = n => D.tribes.filter(t => rosterAt(t, Math.max(D.latest, 2)).includes(n)).length;
  const onTxt = k => k ? `on ${k} tribe${k === 1 ? "" : "s"}` : "on no tribes";
  const row = (name, val, sub, out) => `<li><b class="${out ? "out-name" : ""}">${esc(name)}</b><span>${sub}</span><em>${val}</em></li>`;
  const merged = D.merge < 99;

  // ---- right now: form over the last three scored episodes ----
  const scored = [...new Set(D.events.map(e => e.ep))].sort((a,b) => a - b);
  const win = scored.slice(-3);
  const span = win.length > 1 ? `Eps ${win[0]}–${win[win.length - 1]}` : win.length ? `Ep ${win[0]}` : "";
  const recent = c => win.reduce((s, e) => s + (c.eps[e] || 0), 0);
  const alive = cs.filter(c => !c.out);
  const hot = [...alive].sort((a,b) => recent(b) - recent(a) || b.season - a.season || a.name.localeCompare(b.name)).slice(0, 3);
  // cooling off: widely held players doing the least lately (the old "biggest bust", but on recent form)
  const need = Math.max(2, Math.ceil(N * 0.25));
  const recents = alive.map(recent).sort((a,b) => a - b);
  const midRecent = recents.length ? recents[Math.floor((recents.length - 1) / 2)] : 0;
  const cold = alive.filter(c => held(c.name) >= need && recent(c) <= midRecent)
    .sort((a,b) => recent(a) - recent(b) || held(b.name) - held(a.name) || a.name.localeCompare(b.name)).slice(0, 3);
  // current rosters (same as the draft until the merge swaps)
  const gems = cs.filter(c => held(c.name) <= 3).sort((a,b) => b.season - a.season || held(a.name) - held(b.name));
  const gem = gems[0];
  // sleeper: hidden gem on recent form. Most points lately among players still in on 3 or fewer tribes (not the gem)
  const sleeper = alive.filter(c => held(c.name) <= 3 && c !== gem && recent(c) > 0)
    .sort((a,b) => recent(b) - recent(a) || held(a.name) - held(b.name) || a.name.localeCompare(b.name))[0];

  // ---- season: net points in each pillar of the Episode Log (Outwit, Outplay, ...) ----
  const key = n => n.toLowerCase().replace(/[^a-z]/g, "");
  const byKey = Object.fromEntries(cs.map(c => [key(c.name), c]));
  const pil = PILLARS.map(() => new Map());
  D.events.forEach(ev => {
    const k = pillarOf(ev.label); if (k >= PILLARS.length || /torch lit/i.test(ev.label)) return;   // surviving the week isn't a skill stat
    ev.names.forEach(n => { const c = byKey[key(n)]; if (c) pil[k].set(c, (pil[k].get(c) || 0) + ev.pts); });
  });
  // top 3 (leader big, next two small), with "Full rankings" to open the whole list; ties share a number
  const rkOpen = new Set((store.get("s51.rkopen") || "").split("|").filter(Boolean));
  // everyone tied for 1st shares the big spot; within a tie, players still in come before players who are out
  const rankList = (items, id) => {
    if (!items.length) return "";
    items = [...items].sort((a,b) => b.v - a.v || (a.c.out ? 1 : 0) - (b.c.out ? 1 : 0) || a.c.name.localeCompare(b.c.name));
    const rk = x => 1 + items.filter(o => o.v > x.v).length;
    const open = rkOpen.has(id);
    const leads = items.filter(x => x.v === items[0].v), after = items.slice(leads.length);
    const rest = open ? after : after.slice(0, 2);
    const sub = [items[0].sub, leads.length > 1 ? `${leads.length}-way tie` : ""].filter(Boolean).join(" · ");
    const size = leads.length === 1 ? "" : leads.length <= 2 ? "tie2" : "tie4";
    return `<div class="rk-lead"><b class="${size}">${leads.map(x => `<span class="${x.c.out ? "out-name" : ""}">${esc(x.c.name)}</span>`).join(leads.length > 1 ? ' <i class="sep">·</i> ' : "")}</b>${sub ? `<span>${sub}</span>` : ""}<em>${items[0].v}</em></div>
      ${rest.length ? `<ol class="rk-rest">${rest.map(x => `<li><i>${rk(x)}</i><span class="${x.c.out ? "out-name" : ""}">${esc(x.c.name)}</span><em>${x.v}</em></li>`).join("")}</ol>` : ""}
      ${after.length > 2 ? `<button class="rk-more" data-rk="${id}" aria-expanded="${open}">${open ? "Show top 3" : `Full rankings · ${items.length}`}<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="${open ? "M3 7.5l3-3 3 3" : "M3 4.5l3 3 3-3"}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ""}`;
  };
  const pillarCard = (k) => {
    const [, title, color] = PILLARS[k];
    const ranked = [...pil[k]].filter(([, v]) => v > 0).sort((a,b) => b[1] - a[1] || a[0].name.localeCompare(b[0].name)).map(([c, v]) => ({ c, v }));
    return `<div class="card pillar ${rkOpen.has(title) ? "open" : ""}" style="--pc:${color}"><h3>${title}</h3>${ranked.length ? rankList(ranked, title) : '<p class="muted">Nobody yet</p>'}</div>`;
  };
  const used = [...new Set(Object.keys(D.pointsFor).map(pillarOf))].filter(k => k < PILLARS.length).sort();

  const mp = [...cs].filter(c => picks(c.name) > 0).sort((a,b) => picks(b.name) - picks(a.name) || a.name.localeCompare(b.name)).map(c => ({ c, v: picks(c.name), sub: `on ${Math.round(picks(c.name) / N * 100)}% of tribes` }));
  const mh = [...alive].filter(c => held(c.name) > 0).sort((a,b) => held(b.name) - held(a.name) || a.name.localeCompare(b.name)).map(c => ({ c, v: held(c.name), sub: `on ${Math.round(held(c.name) / N * 100)}% of tribes` }));

  // rock steady: the dependable one. Points every week without the spikes. Only above-median scorers
  // (a steady +1 for surviving isn't dependable), not the season's top 3 (everyone already knows them),
  // and nobody already listed under Cooling off.
  const weekly = c => scored.map(e => c.eps[e] || 0);
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const sd = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
  const means = alive.map(c => mean(weekly(c))).sort((a,b) => a - b);
  const midMean = means.length ? means[Math.floor((means.length - 1) / 2)] : 0;
  const top3 = new Set([...cs].sort((a,b) => b.season - a.season).slice(0, 3).map(c => c.name));
  // a "solid week" is at or above the typical weekly score of players still in (median of every player-week)
  const allWeeks = alive.flatMap(weekly).sort((a,b) => a - b);
  const solidAt = Math.max(1, allWeeks.length ? allWeeks[Math.floor((allWeeks.length - 1) / 2)] : 1);
  const solid = c => weekly(c).filter(x => x >= solidAt).length;
  const steady = scored.length >= 3 ? alive.filter(c => !top3.has(c.name) && !cold.includes(c) && mean(weekly(c)) >= midMean)
    .sort((a,b) => solid(b) - solid(a) || sd(weekly(a)) - sd(weekly(b)) || mean(weekly(b)) - mean(weekly(a)) || a.name.localeCompare(b.name)).slice(0, 3) : [];
  const avgTxt = c => (Math.round(mean(weekly(c)) * 10) / 10).toFixed(1);

  return `${span ? `<h2 style="margin-top:4px">Right now <small class="h2sub">${span}</small></h2>
  <p class="muted" style="font-size:13px;margin:-2px 2px 8px">Points over the last ${win.length > 1 ? `${win.length} episodes` : "episode"}, players still in the game.</p>
  <div class="stats">
    <div class="card stat"><h3>📈 Heating up</h3><p class="muted">Most points lately</p><ul>${hot.map(c => row(c.name, signed(recent(c)), `${onTxt(held(c.name))} · ${c.season} this season`)).join("")}</ul></div>
    ${cold.length ? `<div class="card stat"><h3>🧊 Cooling off</h3><p class="muted">Fewest points lately, on ${need}+ tribes</p><ul>${cold.map(c => row(c.name, signed(recent(c)), `${onTxt(held(c.name))} · ${c.season} this season`)).join("")}</ul></div>` : ""}
    ${steady.length ? `<div class="card stat"><h3>🪨 Rock steady</h3><p class="muted">${solidAt}+ points almost every week, no big spikes</p><ul>${steady.map(c => row(c.name, `${avgTxt(c)}<small>/ep</small>`, `${weekly(c).slice(-5).join(" · ")} · ${onTxt(held(c.name))}`)).join("")}</ul></div>` : ""}
    <div class="pair ${steady.length ? "half" : ""}">
      ${sleeper ? `<div class="card stat"><h3>🎯 Sleeper</h3><p class="muted">Most points lately on 3 or fewer tribes</p><ul>${row(sleeper.name, signed(recent(sleeper)), held(sleeper.name) ? onTxt(held(sleeper.name)) : "nobody has them")}</ul></div>` : ""}
      ${gem ? `<div class="card stat"><h3>💎 Hidden gem</h3><p class="muted">Top scorer on 3 or fewer tribes</p><ul>${row(gem.name, gem.season, held(gem.name) ? onTxt(held(gem.name)) : "nobody has them", gem.out)}</ul></div>` : ""}
    </div>
  </div>` : ""}
  <h2${span ? "" : ' style="margin-top:4px"'}>Season</h2>
  ${used.length ? `<p class="muted" style="font-size:13px;margin:-2px 2px 8px">Top 3 in each part of the scoring sheet (torch points left out). Tap Full rankings for everyone.</p><div class="pillars">${used.map(pillarCard).join("")}</div>` : ""}
  <div class="stats" style="margin-top:10px">
    <div class="card stat ${merged ? "" : "wide"} ${rkOpen.has("picked") ? "open" : ""}"><h3>Most picked</h3><p class="muted">At the draft</p>${rankList(mp, "picked")}</div>
    ${merged ? `<div class="card stat ${rkOpen.has("held") ? "open" : ""}"><h3>Most held now</h3><p class="muted">After merge swaps</p>${rankList(mh, "held")}</div>` : ""}
  </div>`;
}
// one bar per castaway: how many different categories they've scored in, out of all of them (+5 bonus at season end)
function raceBlock(){
  const cats = raceCats(); if (!cats.length) return "";
  const N = cats.length;
  const open = new Set((store.get("s51.raceopen") || "").split("|").filter(Boolean));
  const rows = D.castaways.map(c => ({ c, got: cats.filter(l => hitsOf(c, l) > 0) }))
    .sort((a,b) => b.got.length - a.got.length || (a.c.out ? 1 : 0) - (b.c.out ? 1 : 0) || b.c.season - a.c.season || a.c.name.localeCompare(b.c.name));
  const top = rows.length ? rows[0].got.length : 0;
  const leaders = rows.filter(r => top && r.got.length === top).length;
  const chip = (l, c) => { const k = hitsOf(c, l); return `<span class="cat" style="border-left:3px solid ${pillarColor(l)}">${esc(l)} <b>${signed(D.pointsFor[l] * k)}</b>${k > 1 ? ` <small>(×${k})</small>` : ""}</span>`; };
  const list = rows.map(({ c, got }) => {
    const isOpen = open.has(c.name);
    const cells = cats.map((_, i) => i < got.length ? `<i class="on" style="background:${pillarColor(got[i])}" title="${esc(got[i])}"></i>` : "<i></i>").join("");
    const negs = Object.keys(D.pointsFor).filter(l => D.pointsFor[l] < 0 && hitsOf(c, l) > 0);
    const missing = cats.filter(l => !got.includes(l));
    const detail = isOpen ? `<div class="race-detail">
        ${got.length ? `<div class="cats">${got.map(l => chip(l, c)).join("")}</div>` : '<div class="muted" style="font-size:12px">Nothing yet.</div>'}
        ${missing.length ? `<h4>Still missing</h4><div class="cats">${missing.map(l => `<span class="cat missing" style="border-left:3px solid ${pillarColor(l)}">${esc(l)}</span>`).join("")}</div>` : ""}
        ${negs.length ? `<h4>Penalties (don't count here)</h4><div class="cats">${negs.map(l => { const k = hitsOf(c, l); return `<span class="cat neg">${esc(l)} <b>${signed(D.pointsFor[l] * k)}</b>${k > 1 ? ` <small>(×${k})</small>` : ""}</span>`; }).join("")}</div>` : ""}
      </div>` : "";
    const lead = top && got.length === top ? `<div class="race-lead">${leaders > 1 ? "Tied for the lead" : "Leading"} · +5 if it holds</div>` : "";
    return `<li class="race-row ${c.out ? "out" : ""}" data-race="${esc(c.name)}" aria-expanded="${isOpen}">
      <span class="nm ${c.out ? "out-name" : ""}">${esc(c.name)}</span>
      <div class="race-bar" role="img" aria-label="${got.length} of ${N} categories">${cells}</div>
      <span class="race-n">${got.length}<small>/${N}</small></span>${lead}${detail}</li>`;
  }).join("");
  const used = [...new Set(cats.map(pillarOf))].sort();
  const legend = used.map(k => PILLARS[k] ? `<span><i style="background:${PILLARS[k][2]}"></i>${PILLARS[k][1]}</span>` : "").join("");
  return `<h2>Category race</h2>
    <p class="muted" style="font-size:13px;margin:-2px 2px 8px">How many different categories each castaway has scored in, out of ${N}. Most at the end of the season gets +5. Tap anyone to see which ones.</p>
    <div class="card" style="overflow:hidden">${legend ? `<div class="legend" style="padding:12px 14px 4px">${legend}</div>` : ""}<ul class="race">${list}</ul></div>
    <p class="muted" style="font-size:12px;margin-top:8px">Penalties don't count, since they don't earn points.</p>`;
}

function vCastaways(){
  const sortKey = store.get("s51.csort") || "season";
  const list = [...D.castaways].sort((a,b) => sortKey === "name" ? a.name.localeCompare(b.name) : (b[sortKey] - a[sortKey]) || a.name.localeCompare(b.name));
  const holders = n => D.tribes.filter(t => rosterAt(t, Math.max(D.latest, 2)).includes(n)).sort((a,b) => a.leader.localeCompare(b.leader));
  const onTribes = n => holders(n).length;
  const open = store.get("s51.copen") || "";
  const inGame = list.filter(c => !c.out), outList = list.filter(c => c.out);
  const rowsFor = arr => arr.map(c => {
    const epsHtml = Object.entries(c.eps).filter(([e]) => +e <= Math.max(D.latest, 2)).map(([e, v]) =>
      `<div><small>Ep ${e}</small><b class="${v > 0 ? "pos" : v < 0 ? "negv" : ""}">${v}</b></div>`).join("");
    return `<tr class="main ${c.out ? "out" : ""}" data-c="${esc(c.name)}">
        <td style="width:55%"><b class="${c.out ? "out-name" : ""}">${esc(c.name)}</b>${c.made ? ' <span class="pill tiny">Merge</span>' : ""}${c.out ? ` <span class="pill tiny snuffed">${c.quit ? "Quit" : "Out"} Ep ${c.out}</span>` : ""}<div class="muted hide-sm" style="font-size:12px">${esc(c.full)}</div></td>
        <td class="num"><b>${c.season}</b></td>
        <td class="num">${onTribes(c.name)}</td>
      </tr>
      ${open === c.name ? `<tr class="detail"><td colspan="3"><div class="muted" style="font-size:11px;margin-top:6px">Points by episode</div><div class="eps">${epsHtml}</div>
        <div class="muted" style="font-size:11px;margin-top:12px">On ${onTribes(c.name)} tribe${onTribes(c.name) === 1 ? "" : "s"}</div>
        ${holders(c.name).length ? `<ul class="holders">${holders(c.name).map(t => `<li data-leader="${esc(t.leader)}"><i style="background:${t.color}"></i><b>${esc(t.tribe)}</b><span>${esc(firstName(t.leader))}</span></li>`).join("")}</ul>` : '<div class="muted" style="font-size:12px;margin-top:4px">Nobody picked them</div>'}</td></tr>` : ""}`;
  }).join("");
  const rows = rowsFor(inGame) + (outList.length ? `<tr class="divider"><td colspan="3">Out of the game · ${outList.length}</td></tr>` + rowsFor(outList) : "");
  const th = (k, label, cls="") => `<th class="${cls}" data-sort="${k}">${label}${sortKey === k ? " ▾" : ""}</th>`;
  return `${statsBlock()}${raceBlock()}<h2>All castaways</h2><div class="card" style="overflow:hidden"><table class="ctable">
    <thead><tr>${th("name","Castaway")}${th("season","Points","num")}<th class="num">On tribes</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:12px;margin-top:10px">Tap a castaway to see their points by episode.</p>`;
}

function vEpisodes(){
  const eps = [...new Set(D.events.map(e => e.ep))].sort((a,b) => a - b);
  if (!eps.length) return `<div class="card state">No episodes scored yet.</div>`;
  let ep = +store.get("s51.ep"); if (!eps.includes(ep)) ep = eps[eps.length - 1];
  const chips = eps.map(e => `<button aria-pressed="${e === ep}" data-ep="${e}">Ep ${e}${e === D.merge - 1 ? " · merge" : ""}</button>`).join("");
  const tally = names => { const m = new Map(); names.forEach(n => m.set(n, (m.get(n) || 0) + 1)); return [...m]; };
  const outLine = (list, icon, title) => list.length ? `<div class="ev"><div class="head"><span class="val">${icon}</span><b>${title}</b></div>
      <div class="names">${list.map(c => `<span class="out-name">${esc(c.name)}</span>`).join("")}</div></div>` : "";
  const gone = D.castaways.filter(c => c.out === ep);
  const outEv = outLine(gone.filter(c => !c.quit), "🔥", "Torch snuffed") + outLine(gone.filter(c => c.quit), "🤡", "Quit");
  const evs = outEv + D.events.filter(e => e.ep === ep).map(e => `<div class="ev">
      <div class="head"><span class="val ${e.pts < 0 ? "negv" : "pos"}">${signed(e.pts)}</span><b>${esc(e.label)}${noteFor(e.label) ? ` <small class="note">${esc(noteFor(e.label))}</small>` : ""}</b></div>
      <div class="names">${tally(e.names).map(([n, k]) => `<span>${esc(n)}${k > 1 ? ` <b>×${k}</b>` : ""}</span>`).join("")}</div></div>`).join("");
  const top = [...D.castaways].map(c => ({ n: c.name, p: c.eps[ep] || 0 })).filter(x => x.p !== 0).sort((a,b) => b.p - a.p).slice(0, 5);
  return `<div class="epchips">${chips}</div>
    <div class="grid2">
      <div><h2 style="margin-top:0">What happened</h2><div class="card">${evs}</div></div>
      <div><h2 style="margin-top:0">Top scorers</h2><div class="card"><ul class="players">${top.map(x =>
        `<li class="player"><div class="top">${avatar(x.n)}<div class="who"><b>${esc(x.n)}</b></div><div class="pts ${x.p < 0 ? "negv" : ""}">${signed(x.p)}</div></div></li>`).join("")}</ul></div></div>
    </div>`;
}

let _rw = window.innerWidth;
window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - _rw) > 40 && document.querySelector(".rankchart svg")) { _rw = window.innerWidth; render(); } });
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
  const app = $("#app");
  if (!D){ return; }
  app.innerHTML = view === "standings" ? vStandings() : view === "tribe" ? vTribe() : view === "castaways" ? vCastaways() : vEpisodes();
  app.insertAdjacentHTML("beforeend", `<div class="foot">Scores refresh a few minutes after Jeff updates the sheet.<button id="refresh">Refresh</button></div>`);
}

function header(){
  const through = D.latest ? `Scores through Episode ${D.latest}` : "Season starts soon";
  $("#sub").textContent = through + (D.merge < 99 ? ` · merged at Ep ${D.merge - 1}` : "");
  const p = D.pot;
  $("#pot").innerHTML = p.total ? `<div class="p-total">Pot<b>${esc(p.total)}</b></div><div class="p1">🥇 1st<b>${esc(p.p1)}</b></div><div class="p2">🥈 2nd<b>${esc(p.p2)}</b></div><div class="p3">🥉 3rd<b>${esc(p.p3)}</b></div>` : "";
}

// Show the last scores this browser saw right away, then swap in fresh ones from the sheet.
const CACHE_KEY = "s51.cache.v1";
function show(texts){ D = model(...texts.map(parseCSV)); header(); render(); }
async function load(){
  let cached = null;
  try{ cached = JSON.parse(store.get(CACHE_KEY) || "null"); }catch(e){}
  if (!D && cached?.texts){ try{ show(cached.texts); $("#sub").textContent += " · updating…"; }catch(e){ cached = null; } }
  try{
    const texts = await Promise.all([TABS.standings, TABS.log, TABS.tribes, TABS.castaways].map(getTab));
    if (!cached || cached.texts.join("\u0000") !== texts.join("\u0000")) show(texts); else header();
    store.set(CACHE_KEY, JSON.stringify({ texts, at: Date.now() }));
  }catch(err){
    console.error(err);
    if (D){ header(); $("#sub").textContent += " · couldn't refresh, showing last saved scores"; return; }
    $("#sub").textContent = "Couldn't load scores";
    $("#app").innerHTML = `<div class="card state">Couldn't reach the scoresheet. Check your connection and try again.<br><br><button class="pill" id="refresh" style="cursor:pointer">Try again</button></div>`;
  }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){ view = go.dataset.go; store.set("s51.view", view); render(); window.scrollTo({ top: 0 }); return; }
  const tab = e.target.closest("nav.tabs button");
  if (tab){ view = tab.dataset.view; store.set("s51.view", view); render(); window.scrollTo({ top: 0 }); return; }
  const hold = e.target.closest(".holders li");
  if (hold){ store.set("s51.tribe", hold.dataset.leader); view = "tribe"; store.set("s51.view", view); render(); window.scrollTo({ top: 0 }); return; }
  const ot = e.target.closest("[data-open-tribe]");
  if (ot){ store.set("s51.tribe", ot.dataset.openTribe); view = "tribe"; store.set("s51.view", view); render(); window.scrollTo({ top: 0 }); return; }
  const st = e.target.closest(".st-item");
  if (st){ store.set("s51.tribe", st.dataset.leader); view = "tribe"; store.set("s51.view", view); render(); window.scrollTo({ top: 0 }); return; }
  const rr = e.target.closest(".race-row");
  if (rr && !e.target.closest(".race-detail")){
    const open = new Set((store.get("s51.raceopen") || "").split("|").filter(Boolean));
    open.has(rr.dataset.race) ? open.delete(rr.dataset.race) : open.add(rr.dataset.race);
    store.set("s51.raceopen", [...open].join("|")); render(); return;
  }
  const rkb = e.target.closest(".rk-more");
  if (rkb){ const open = new Set((store.get("s51.rkopen") || "").split("|").filter(Boolean)); open.has(rkb.dataset.rk) ? open.delete(rkb.dataset.rk) : open.add(rkb.dataset.rk);
    store.set("s51.rkopen", [...open].join("|")); render(); return; }
  const th = e.target.closest("th[data-sort]");
  if (th){ store.set("s51.csort", th.dataset.sort); render(); return; }
  const tr = e.target.closest("tr.main");
  if (tr){ store.set("s51.copen", store.get("s51.copen") === tr.dataset.c ? "" : tr.dataset.c); render(); return; }
  const epb = e.target.closest(".epchips button");
  if (epb){ store.set("s51.ep", epb.dataset.ep); render(); return; }
  if (e.target.id === "refresh"){ $("#sub").textContent = "Refreshing…"; load(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "tribeSel"){ store.set("s51.tribe", e.target.value); render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){ const id = e.target.id; store.set("s51.q", e.target.value); const pos = e.target.selectionStart; render(); const q = $("#" + id); q.focus(); q.setSelectionRange(pos, pos); }
});
view = store.get("s51.view") || "standings";
const hashView = location.hash.replace("#", ""); if (["standings","tribe","castaways","episodes"].includes(hashView)) view = hashView;
if (view === "all" || hashView === "all") view = "standings";   // All Tribes was folded into Standings
render(); load();
</script>
</body>
</html>
